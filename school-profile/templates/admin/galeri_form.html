{% extends 'admin/base_admin.html' %}

{% block content %}

<div class="page-head">
  <div>
    <h1>{{ title }}</h1>
    <p>Format gambar: JPG, JPEG, PNG, atau WEBP. Maksimal 5 MB.</p>
  </div>
  <a class="btn btn--sm" href="{{ url_for('admin.galeri') }}">&larr; Kembali ke daftar</a>
</div>

<form class="card" method="post" enctype="multipart/form-data">
  <div class="form-grid">
    <div class="field">
      <label for="judul">Judul Foto *</label>
      <input type="text" id="judul" name="judul" value="{{ item.judul if item else '' }}" required>
    </div>
    <div class="field">
      <label for="kategori">Kategori</label>
      <select id="kategori" name="kategori">
        {% for kategori in ['Kegiatan Sekolah', 'Pembelajaran', 'Ekstrakurikuler', 'Prestasi', 'Fasilitas', 'Acara'] %}
          <option value="{{ kategori }}" {{ 'selected' if item and item.kategori == kategori }}>{{ kategori }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="field">
    <label for="keterangan">Keterangan</label>
    <textarea id="keterangan" name="keterangan" style="min-height:80px">{{ item.keterangan if item else '' }}</textarea>
  </div>

  <div class="form-grid">
    <div class="field">
      <label for="tanggal">Tanggal</label>
      <input type="date" id="tanggal" name="tanggal" value="{{ item.tanggal if item else '' }}" data-tanggal-default>
    </div>
    <div class="field">
      <label for="foto">File Gambar {{ '*' if not item else '' }}</label>
      <input type="file" id="foto" name="foto" accept=".jpg,.jpeg,.png,.webp" data-preview="info-galeri">
      <p class="hint" id="info-galeri">Belum ada file dipilih.</p>
    </div>
  </div>

  {% if item and item.foto %}
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <img class="thumb-sm" style="width:120px;height:90px" src="{{ item.foto|gambar }}" alt="Foto saat ini">
      <label class="check"><input type="checkbox" name="hapus_gambar" value="ya"> Hapus foto ini</label>
    </div>
  {% endif %}

  <div class="form-actions">
    <button class="btn btn--primary" type="submit">Simpan Foto</button>
    <a class="btn" href="{{ url_for('admin.galeri') }}">Batal</a>
  </div>
</form>

{% endblock %}
