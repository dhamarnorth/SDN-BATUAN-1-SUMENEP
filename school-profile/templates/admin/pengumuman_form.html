{% extends 'admin/base_admin.html' %}

{% block content %}

<div class="page-head">
  <div>
    <h1>{{ title }}</h1>
    <p>Pengumuman dapat diberi tanggal mulai dan selesai.</p>
  </div>
  <a class="btn btn--sm" href="{{ url_for('admin.pengumuman') }}">&larr; Kembali ke daftar</a>
</div>

<form class="card" method="post">
  <div class="field">
    <label for="judul">Judul Pengumuman *</label>
    <input type="text" id="judul" name="judul" value="{{ item.judul if item else '' }}" required>
  </div>

  <div class="form-grid">
    <div class="field">
      <label for="tanggal_mulai">Tanggal Mulai</label>
      <input type="date" id="tanggal_mulai" name="tanggal_mulai" value="{{ item.tanggal_mulai if item else '' }}">
    </div>
    <div class="field">
      <label for="tanggal_selesai">Tanggal Selesai</label>
      <input type="date" id="tanggal_selesai" name="tanggal_selesai" value="{{ item.tanggal_selesai if item else '' }}">
      <p class="hint">Kosongkan bila tidak ada batas waktu.</p>
    </div>
  </div>

  <div class="field">
    <label for="isi">Isi Pengumuman *</label>
    <textarea id="isi" name="isi" style="min-height:150px" required>{{ item.isi if item else '' }}</textarea>
  </div>

  <div class="field">
    <label class="check">
      <input type="checkbox" name="aktif" value="1" {{ 'checked' if not item or item.aktif }}>
      Tampilkan pengumuman ini di beranda
    </label>
  </div>

  <div class="form-actions">
    <button class="btn btn--primary" type="submit">Simpan Pengumuman</button>
    <a class="btn" href="{{ url_for('admin.pengumuman') }}">Batal</a>
  </div>
</form>

{% endblock %}
