{% extends 'admin/base_admin.html' %}

{% block content %}

<div class="page-head">
  <div>
    <h1>Akun Admin</h1>
    <p>Ubah username dan password yang dipakai untuk masuk dashboard.</p>
  </div>
</div>

<form class="card" method="post" style="max-width:520px">
  <div class="field">
    <label for="username">Username *</label>
    <input type="text" id="username" name="username" value="{{ admin.username }}" required>
  </div>

  <div class="field">
    <label for="password_baru">Password Baru</label>
    <input type="password" id="password_baru" name="password_baru" autocomplete="new-password">
    <p class="hint">Minimal 6 karakter. Kosongkan bila tidak ingin mengganti password.</p>
  </div>

  <div class="field">
    <label for="password_konfirmasi">Ulangi Password Baru</label>
    <input type="password" id="password_konfirmasi" name="password_konfirmasi" autocomplete="new-password">
  </div>

  <div class="form-actions">
    <button class="btn btn--primary" type="submit">Simpan Akun</button>
    <a class="btn" href="{{ url_for('admin.dashboard') }}">Batal</a>
  </div>
</form>

{% endblock %}
